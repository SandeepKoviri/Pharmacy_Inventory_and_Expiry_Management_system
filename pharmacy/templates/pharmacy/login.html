{% extends 'pharmacy/base.html' %}{% block title %}Login - PharmaCare{% endblock %}{% block content %}<div class="auth-page"><div class="auth-card"><div class="auth-logo"><i class="bi bi-capsule-pill"></i> PharmaCare</div><h2>Welcome Back</h2><p class="auth-subtitle">Login to your pharmacy account</p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div><div class="mb-3"><label class="form-label">Login As</label><select name="role" class="form-select"><option value="staff">Staff</option><option value="admin">Admin</option></select></div><button class="btn auth-btn">Login</button></form><p class="auth-switch">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p><a class="back-home" href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> Back to Home</a></div></div>{% endblock %}
