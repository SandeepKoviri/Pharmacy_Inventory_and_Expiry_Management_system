{% extends 'pharmacy/base.html' %}{% block title %}{% if medicine %}Edit{% else %}Add{% endif %} Medicine - PharmaCare{% endblock %}{% block content %}<div class="form-page"><div class="content-card form-card"><div class="page-header compact"><div><a href="{% url 'medicines' %}" class="back-link">← Medicines</a><h1>{% if medicine %}Edit{% else %}Add{% endif %} Medicine</h1></div></div><form method="post" class="row g-3">{% csrf_token %}<div class="col-md-6"><label>Medicine Name</label><input name="name" class="form-control" value="{{ medicine.name|default:'' }}" required></div><div class="col-md-6"><label>Generic Name</label><input name="generic_name" class="form-control" value="{{ medicine.generic_name|default:'' }}"></div><div class="col-md-6"><label>Manufacturer</label><select name="manufacturer" class="form-select" required><option value="">Select manufacturer</option>{% for x in manufacturers %}<option value="{{ x.id }}" {% if medicine.manufacturer_id == x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Batch Number</label><input name="batch_number" class="form-control" value="{{ medicine.batch_number|default:'' }}" required></div><div class="col-md-6"><label>Manufacturing Date</label><input type="date" name="manufacturing_date" class="form-control" value="{{ medicine.manufacturing_date|date:'Y-m-d' }}" required></div><div class="col-md-6"><label>Expiry Date</label><input type="date" name="expiry_date" class="form-control" value="{{ medicine.expiry_date|date:'Y-m-d' }}" required></div><div class="col-md-4"><label>Price</label><input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ medicine.price|default:'' }}" required></div><div class="col-md-4"><label>Opening Stock</label><input type="number" min="0" name="stock" class="form-control" value="{{ medicine.stock|default:0 }}" required></div><div class="col-md-4"><label>Reorder Level</label><input type="number" min="0" name="reorder_level" class="form-control" value="{{ medicine.reorder_level|default:10 }}" required></div><div class="col-12"><label>Description</label><textarea name="description" class="form-control" rows="4">{{ medicine.description|default:'' }}</textarea></div><div class="col-12"><button class="btn primary-btn">Save Medicine</button><a href="{% url 'medicines' %}" class="btn btn-light ms-2">Cancel</a></div></form></div></div>{% endblock %}
