{% extends 'pharmacy/base.html' %}{% block title %}Sign Up - PharmaCare{% endblock %}{% block content %}<div class="auth-page"><div class="auth-card signup-card"><div class="auth-logo"><i class="bi bi-capsule-pill"></i> PharmaCare</div><h2>Create Staff Account</h2><p class="auth-subtitle">Create an account for pharmacy staff</p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div><div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="8" required></div><div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" minlength="8" required></div><button class="btn auth-btn">Create Account</button></form><p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p><a class="back-home" href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> Back to Home</a></div></div>{% endblock %}
