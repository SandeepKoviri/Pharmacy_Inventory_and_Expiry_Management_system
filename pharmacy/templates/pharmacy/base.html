{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PharmaCare{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'pharmacy/css/style.css' %}">
</head>
<body>
{% if messages %}<div class="toast-stack">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} shadow-sm">{{ message }}</div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'pharmacy/js/script.js' %}"></script>
{% block scripts %}{% endblock %}
</body></html>
